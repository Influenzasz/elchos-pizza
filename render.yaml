# ==============================================================================
# Спецификация Render Blueprint для автоматического развертывания
# Сервис: Elcho's Pizza Enterprise Suite
# ==============================================================================
services:
  - type: web
    name: elchos-pizza
    runtime: docker
    plan: free
    region: frankfurt # или oregon / singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /api/categories
    envVars:
      - key: PORT
        value: 10000
      - key: AUTO_OPEN_BROWSER
        value: false
