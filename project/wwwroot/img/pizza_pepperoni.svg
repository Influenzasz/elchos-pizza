<svg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <radialGradient id='crust' cx='50%' cy='50%' r='50%'>
      <stop offset='75%' stop-color='#E67E22'/>
      <stop offset='95%' stop-color='#D35400'/>
      <stop offset='100%' stop-color='#A04000'/>
    </radialGradient>
    <radialGradient id='cheese' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#FFF9C4'/>
      <stop offset='60%' stop-color='#FBC02D'/>
      <stop offset='85%' stop-color='#F57F17'/>
      <stop offset='100%' stop-color='#E65100'/>
    </radialGradient>
    <radialGradient id='pep' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#E53935'/>
      <stop offset='70%' stop-color='#C62828'/>
      <stop offset='100%' stop-color='#8E0000'/>
    </radialGradient>
    <filter id='drop' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='8' stdDeviation='10' flood-color='#000' flood-opacity='0.25'/>
    </filter>
  </defs>
  <circle cx='200' cy='200' r='185' fill='url(#crust)' filter='url(#drop)'/>
  <circle cx='200' cy='200' r='160' fill='url(#cheese)'/>
  <!-- Pepperoni Slices -->
  <g fill='url(#pep)'>
    <circle cx='200' cy='120' r='28'/><circle cx='135' cy='165' r='28'/><circle cx='265' cy='165' r='28'/>
    <circle cx='150' cy='245' r='28'/><circle cx='250' cy='245' r='28'/><circle cx='200' cy='200' r='30'/>
    <circle cx='190' cy='275' r='26'/><circle cx='105' cy='210' r='25'/><circle cx='295' cy='210' r='25'/>
  </g>
  <!-- Herbs -->
  <g fill='#2E7D32'>
    <ellipse cx='170' cy='140' rx='8' ry='4' transform='rotate(25 170 140)'/>
    <ellipse cx='230' cy='140' rx='8' ry='4' transform='rotate(-20 230 140)'/>
    <ellipse cx='140' cy='205' rx='7' ry='3' transform='rotate(45 140 205)'/>
    <ellipse cx='260' cy='205' rx='7' ry='3' transform='rotate(-35 260 205)'/>
    <ellipse cx='200' cy='240' rx='9' ry='4' transform='rotate(10 200 240)'/>
  </g>
</svg>