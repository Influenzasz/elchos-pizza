<svg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'>
  <defs>
    <linearGradient id='cup' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#CFD8DC'/><stop offset='50%' stop-color='#FFFFFF'/><stop offset='100%' stop-color='#B0BEC5'/>
    </linearGradient>
    <filter id='dropK'><feDropShadow dx='0' dy='6' stdDeviation='8' flood-color='#000' flood-opacity='0.2'/></filter>
  </defs>
  <!-- Saucer -->
  <ellipse cx='200' cy='280' rx='110' ry='25' fill='#ECEFF1' filter='url(#dropK)'/>
  <!-- Cup -->
  <path d='M130,160 L270,160 L250,260 Q200,280 150,260 Z' fill='url(#cup)' filter='url(#dropK)'/>
  <!-- Handle -->
  <path d='M260,180 Q310,180 300,225 Q290,260 245,250' stroke='#CFD8DC' stroke-width='14' fill='none'/>
  <!-- Coffee surface -->
  <ellipse cx='200' cy='160' rx='70' ry='22' fill='#4E342E'/>
  <ellipse cx='200' cy='160' rx='50' ry='15' fill='#D7CCC8'/>
  <!-- Steam -->
  <path d='M180,120 Q170,90 185,70' stroke='#B0BEC5' stroke-width='4' stroke-linecap='round' fill='none'/>
  <path d='M205,125 Q215,95 200,65' stroke='#B0BEC5' stroke-width='4' stroke-linecap='round' fill='none'/>
</svg>